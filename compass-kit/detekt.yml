  UseRequireNotNull:
    active: true
  UselessCallOnNotNull:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true
    excludes: [ '**/test/**', '**/test[A-Z]*/**', '**/androidTest/**', '**/*Test/**' ]
#    excludeImports:
